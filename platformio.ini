; SENTINEL 2.0 - PlatformIO Configuration
; Target: ESP32 Development Board (ESP-WROOM-32 / ESP32-DevKitC)
; ₹0 Software/Tooling Target: Arduino Core for ESP32

[platformio]
default_envs = esp32dev
src_dir = firmware/sentinel

[env:esp32dev]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D BOARD_HAS_PSRAM=0

lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    bblanchon/ArduinoJson@^7.0.4

; Alternative environments for other common student boards
[env:esp32-s3]
platform = espressif32@^6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    bblanchon/ArduinoJson@^7.0.4

[env:esp32-c3]
platform = espressif32@^6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
    bblanchon/ArduinoJson@^7.0.4
